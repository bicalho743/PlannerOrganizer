<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<title>Login com Google</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0D1B35;
  font-family: 'DM Sans', sans-serif;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh; color: #F5F0E8;
}
.card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(201,168,76,0.22);
  border-radius: 16px; padding: 2rem;
  text-align: center; max-width: 320px; width: 90%;
}
h2 { font-size: 1.2rem; margin-bottom: 0.5rem; }
p { font-size: 0.8rem; color: rgba(245,240,232,0.5); margin-bottom: 1.5rem; }
#msg { font-size: 0.8rem; margin-top: 1rem; min-height: 20px; color: rgba(245,240,232,0.6); }
#msg.err { color: #f08080; }
.spinner {
  width: 32px; height: 32px; border: 3px solid rgba(201,168,76,0.2);
  border-top-color: #C9A84C; border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="spinner" id="spinner"></div>
  <h2>Autenticando com Google</h2>
  <p>Aguarde um momento...</p>
  <div id="msg"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const p    = new URLSearchParams(window.location.search);
const msg  = document.getElementById("msg");
const spin = document.getElementById("spinner");

const app = initializeApp({
  apiKey:     p.get("apiKey"),
  authDomain: p.get("authDomain"),
  projectId:  p.get("projectId"),
  appId:      p.get("appId")
});
const auth     = getAuth(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });

try {
  const result = await getRedirectResult(auth);
  if (result && result.user) {
    const user = result.user;
    msg.textContent = "Sucesso! Fechando...";
    if (window.opener) {
      window.opener.postMessage({
        type:        "google_auth_success",
        uid:         user.uid,
        email:       user.email,
        displayName: user.displayName || ""
      }, "*");
    }
    setTimeout(() => window.close(), 800);
  } else {
    msg.textContent = "Redirecionando para o Google...";
    await signInWithRedirect(auth, provider);
  }
} catch(e) {
  spin.style.display = "none";
  msg.className = "err";
  if (e.code === "auth/popup-closed-by-user") {
    msg.textContent = "Cancelado.";
  } else {
    msg.textContent = e.message || "Erro no login.";
  }
}
</script>
</body>
</html>
