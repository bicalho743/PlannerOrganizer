<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Stripe</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        
        h1 {
            color: #1E366F;
            margin-bottom: 20px;
        }
        
        p {
            margin-bottom: 20px;
            color: #555;
        }
        
        .price {
            font-size: 24px;
            font-weight: bold;
            color: #1E88E5;
            margin: 10px 0;
        }
        
        .button {
            background-color: #1E88E5;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background-color 0.3s;
            display: inline-block;
            margin-top: 20px;
        }
        
        .button:hover {
            background-color: #1565C0;
        }
        
        .error {
            color: #D32F2F;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <h1 id="plan-title">Checkout do Plano</h1>
    <p id="plan-description">Você está prestes a assinar nosso plano.</p>
    <div class="price" id="plan-price">R$ 0,00</div>
    <button class="button" id="checkout-button">Prosseguir para pagamento</button>
    <p class="error" id="error-message">Ocorreu um erro ao processar seu pagamento.</p>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Obter parâmetros da URL
            const urlParams = new URLSearchParams(window.location.search);
            const planId = urlParams.get('plan');
            const stripeKey = urlParams.get('key');
            
            // Configurar o Stripe com a chave pública
            const stripe = Stripe(stripeKey);
            
            // Configurações do plano
            const planConfigs = {
                'mensal': {
                    title: 'Plano Mensal',
                    description: 'Você está prestes a assinar nosso plano mensal com 7 dias de teste grátis.',
                    price: 'R$ 9,70/mês',
                    priceId: 'price_1RFBNXLWUPER7pUXzmz8cdsL',
                    mode: 'subscription'
                },
                'anual': {
                    title: 'Plano Anual',
                    description: 'Você está prestes a assinar nosso plano anual com 7 dias de teste grátis.',
                    price: 'R$ 97,00/ano',
                    priceId: 'price_1RFBTtLWUPER7pUXPt2Ajhgz',
                    mode: 'subscription'
                },
                'vitalicio': {
                    title: 'Acesso Vitalício',
                    description: 'Você está prestes a adquirir nosso acesso vitalício.',
                    price: 'R$ 247,00 (pagamento único)',
                    priceId: 'price_1RFBULLWUPER7pUXCiGZn3Jn',
                    mode: 'payment'
                }
            };
            
            // Verificar se o plano é válido
            if (!planId || !planConfigs[planId]) {
                document.getElementById('plan-title').textContent = 'Plano não encontrado';
                document.getElementById('plan-description').textContent = 'O plano especificado não existe.';
                document.getElementById('checkout-button').style.display = 'none';
                return;
            }
            
            // Preencher informações do plano
            const config = planConfigs[planId];
            document.getElementById('plan-title').textContent = config.title;
            document.getElementById('plan-description').textContent = config.description;
            document.getElementById('plan-price').textContent = config.price;
            
            // Configurar o botão de checkout
            document.getElementById('checkout-button').addEventListener('click', function() {
                // Adicionar timestamp para evitar cache
                const timestamp = new Date().getTime();
                
                // Redirecionar para o Checkout do Stripe
                stripe.redirectToCheckout({
                    lineItems: [{
                        price: config.priceId,
                        quantity: 1
                    }],
                    mode: config.mode,
                    successUrl: window.location.origin + '/sucesso?t=' + timestamp,
                    cancelUrl: window.location.origin + '/cancelado?t=' + timestamp,
                    clientReferenceId: 'client_' + timestamp
                }).then(function(result) {
                    if (result.error) {
                        // Exibir mensagem de erro
                        const errorElement = document.getElementById('error-message');
                        errorElement.textContent = result.error.message;
                        errorElement.style.display = 'block';
                    }
                });
            });
        });
    </script>
</body>
</html>
