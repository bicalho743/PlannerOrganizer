<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planner Organizer - Checkout</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            color: #1E366F;
            margin-bottom: 20px;
        }
        
        p {
            color: #5A6A85;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .stripe-button-container {
            margin: 30px auto;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #1E88E5;
            text-decoration: none;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .logo {
            margin-bottom: 20px;
            max-width: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://placehold.co/200x60/1E366F/FFFFFF/?text=Planner+Organizer" alt="Planner Organizer Logo" class="logo">
        <h1>Finalize sua Assinatura</h1>
        <p>Você está a um passo de transformar a gestão das suas propostas e finanças. Clique no botão abaixo para finalizar seu pagamento de forma segura com o Stripe.</p>
        
        <div class="stripe-button-container">
            <!-- Botão Stripe para o Plano Anual -->
            <script async src="https://js.stripe.com/v3/buy-button.js"></script>
            <stripe-buy-button
              buy-button-id="buy_btn_1RFYm8LWUPER7pUX86vf04TC"
              publishable-key="pk_live_51RFB2dLWUPER7pUXim2VuVkCESsrjNcHkDQuMJeDCvvW0ZsyFfqM2exfCTwSSe5O4R2TXBxHJtIpYSGBTAx2gBXT00gpAVYK1f"
            >
            </stripe-buy-button>
        </div>
        
        <a href="/" class="back-link">Voltar para a página inicial</a>
    </div>
</body>
</html>
