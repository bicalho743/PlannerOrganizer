<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login com Redes Sociais - Planner Organizer</title>
    
    <!-- Firebase App (a base) sempre é necessário e deve ser carregado primeiro -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Adicione outros SDKs do Firebase que você precisa -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        h1 {
            color: #1E366F;
            margin-bottom: 1.5rem;
        }
        
        p {
            color: #666;
            margin-bottom: 1.5rem;
        }
        
        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 1.5rem;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 0.8rem;
            border-radius: 4px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }
        
        .btn svg, .btn img {
            margin-right: 10px;
            width: 20px;
            height: 20px;
        }
        
        .btn-google {
            background-color: white;
            color: #444;
            border: 1px solid #ddd;
        }
        
        .btn-google:hover {
            background-color: #f1f1f1;
        }
        
        .btn-facebook {
            background-color: #3b5998;
            color: white;
        }
        
        .btn-facebook:hover {
            background-color: #334d84;
        }
        
        #login-status {
            margin-top: 1.5rem;
            padding: 0.75rem;
            border-radius: 4px;
            display: none;
        }
        
        #login-status.success {
            background-color: #e8f5e9;
            color: #2e7d32;
            display: block;
        }
        
        #login-status.error {
            background-color: #ffebee;
            color: #c62828;
            display: block;
        }
        
        .footer {
            margin-top: 2rem;
            color: #999;
            font-size: 0.8rem;
        }
        
        .footer a {
            color: #1E88E5;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://planner-organiza.com.br/static/favicon.png" alt="Logo Planner Organizer" class="logo">
        <h1>Login com Redes Sociais</h1>
        <p>Escolha um dos métodos de login abaixo para acessar o Planner Organizer:</p>
        
        <button id="google-login-btn" class="btn btn-google">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google icon">
            Entrar com Google
        </button>
        
        <button id="facebook-login-btn" class="btn btn-facebook">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="white">
                <path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm3 8h-1.35c-.538 0-.65.221-.65.778v1.222h2l-.209 2h-1.791v7h-3v-7h-2v-2h2v-2.308c0-1.769.931-2.692 3.029-2.692h1.971v3z"/>
            </svg>
            Entrar com Facebook
        </button>
        
        <div id="login-status"></div>
        
        <div class="footer">
            Ao fazer login, você concorda com os <a href="#">Termos de Uso</a> e <a href="#">Política de Privacidade</a>.
            <br><br>
            &copy; 2025 Planner Organizer. Todos os direitos reservados.
        </div>
    </div>
    
    <!-- Script para autenticação -->
    <script src="/js/firebase-auth.js"></script>
</body>
</html>
