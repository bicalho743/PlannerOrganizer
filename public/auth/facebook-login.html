<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login Social - Planner Organizer</title>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js"></script>
</head>
<body style="text-align:center; padding: 50px; font-family: sans-serif;">
  <h2>Autenticação com Facebook</h2>
  <button onclick="loginComFacebook()" style="padding: 10px 20px; font-size: 16px;">Entrar com Facebook</button>

  <script>
    // CONFIGURAÇÃO DO FIREBASE COM SUAS CHAVES
    const firebaseConfig = {
      apiKey: "AIzaSyAtuIO-4oyI99rQSl9dAMu756FI4q10kcY",
      authDomain: "planner-organizer-68a23.firebaseapp.com",
      databaseURL: "https://planner-organizer-68a23-default-rtdb.firebaseio.com",
      projectId: "planner-organizer-68a23",
      storageBucket: "planner-organizer-68a23.appspot.com",
      messagingSenderId: "275264106992",
      appId: "1:275264106992:web:3040a39f4f3530693c6d35",
      measurementId: "G-E9KP3F40VT"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function loginComFacebook() {
      const provider = new firebase.auth.FacebookAuthProvider();

      auth.signInWithPopup(provider)
        .then((result) => {
          return result.user.getIdToken();
        })
        .then((token) => {
          // Substitua abaixo pelo seu link real no Replit
          window.location.href = `https://plannerorganizer.bicalho743.repl.co/?token=${token}`;
        })
        .catch((error) => {
          alert("Erro ao autenticar com Facebook: " + error.message);
        });
    }
  </script>
</body>
</html>
