<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Firebase</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    
    <style>
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .google-button {
            background-color: white;
            color: #444;
            border: 1px solid #ddd;
        }
        .google-button:hover {
            background-color: #f5f5f5;
        }
        .facebook-button {
            background-color: #3b5998;
            color: white;
        }
        .facebook-button:hover {
            background-color: #344e86;
        }
        .icon {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .loading {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Escolha uma forma de login</h2>
        
        <button id="googleBtn" class="login-button google-button">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="icon">
            Continuar com Google
        </button>
        
        <button id="facebookBtn" class="login-button facebook-button">
            <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="white">
                <path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm3 8h-1.35c-.538 0-.65.221-.65.778v1.222h2l-.209 2h-1.791v7h-3v-7h-2v-2h2v-2.308c0-1.769.931-2.692 3.029-2.692h1.971v3z"/>
            </svg>
            Continuar com Facebook
        </button>
        
        <div id="status" class="status" style="display: none;"></div>
        <div id="loading" class="loading">Redirecionando...</div>
    </div>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDNvFRG_LcmnrQlvGzHx5_dR16vCUTp13I",
            authDomain: "planner-organizer-68a23.firebaseapp.com",
            projectId: "planner-organizer-68a23",
            storageBucket: "planner-organizer-68a23.appspot.com",
            messagingSenderId: "763383033284",
            appId: "1:763383033284:web:5a5dc3b4d3f5bc63631ce7"
        };
        
        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const googleProvider = new firebase.auth.GoogleAuthProvider();
        const facebookProvider = new firebase.auth.FacebookAuthProvider();
        
        // Adicionar parâmetros personalizados
        googleProvider.setCustomParameters({
            prompt: 'select_account'
        });
        
        // Referências para elementos DOM
        const googleBtn = document.getElementById('googleBtn');
        const facebookBtn = document.getElementById('facebookBtn');
        const statusDiv = document.getElementById('status');
        const loadingDiv = document.getElementById('loading');
        
        // Função para mostrar mensagem de status
        function showStatus(message, isError = false) {
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';
            
            if (isError) {
                statusDiv.className = 'status error';
            } else {
                statusDiv.className = 'status success';
            }
        }
        
        // Função para ocultar mensagem de status
        function hideStatus() {
            statusDiv.style.display = 'none';
        }
        
        // Função para mostrar indicador de carregamento
        function showLoading() {
            loadingDiv.style.display = 'block';
        }
        
        // Função para ocultar indicador de carregamento
        function hideLoading() {
            loadingDiv.style.display = 'none';
        }
        
        // Função para lidar com o login bem-sucedido
        function handleSuccessfulLogin(result) {
            const user = result.user;
            
            // Mostrar mensagem de sucesso
            showStatus(`Login bem-sucedido como ${user.email}`);
            showLoading();
            
            // Obter token
            user.getIdToken().then(token => {
                // Dados do usuário para passar para o aplicativo principal
                const userData = {
                    uid: user.uid,
                    email: user.email,
                    displayName: user.displayName || user.email.split('@')[0],
                    photoURL: user.photoURL,
                    token: token
                };
                
                // Salvar no localStorage (para persistência)
                localStorage.setItem('firebase_user', JSON.stringify(userData));
                
                // Comunicar com o aplicativo principal (Streamlit)
                window.parent.postMessage({
                    type: 'FIREBASE_AUTH_SUCCESS',
                    payload: userData
                }, '*');
                
                // Se estiver em um iframe, redirecionar o pai
                if (window.parent !== window) {
                    // Criar URL para redirecionar
                    const returnUrl = new URL(window.location.href);
                    returnUrl.searchParams.set('auth_success', 'true');
                    returnUrl.searchParams.set('uid', user.uid);
                    returnUrl.searchParams.set('email', user.email);
                    
                    // Tentar redirecionar o parent
                    try {
                        window.parent.location.href = returnUrl.toString();
                    } catch (e) {
                        console.error("Não foi possível redirecionar o parent:", e);
                    }
                }
            });
        }
        
        // Função para lidar com erros de login
        function handleLoginError(error, provider) {
            console.error(`Erro no login com ${provider}:`, error);
            showStatus(`Erro no login com ${provider}: ${error.message}`, true);
            hideLoading();
        }
        
        // Event listener para o botão do Google
        googleBtn.addEventListener('click', () => {
            hideStatus();
            
            auth.signInWithPopup(googleProvider)
                .then(handleSuccessfulLogin)
                .catch(error => handleLoginError(error, 'Google'));
        });
        
        // Event listener para o botão do Facebook
        facebookBtn.addEventListener('click', () => {
            hideStatus();
            
            auth.signInWithPopup(facebookProvider)
                .then(handleSuccessfulLogin)
                .catch(error => handleLoginError(error, 'Facebook'));
        });
        
        // Verificar se o usuário já está logado
        auth.onAuthStateChanged(user => {
            if (user) {
                console.log('Usuário já logado:', user.email);
                handleSuccessfulLogin({ user });
            }
        });
    </script>
</body>
</html>
