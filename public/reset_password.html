<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de Senha - Planner Organizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            padding-top: 40px;
        }
        .card {
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .card-header {
            background-color: #1E366F;
            color: white;
            border-radius: 8px 8px 0 0 !important;
            padding: 20px;
            text-align: center;
        }
        .btn-primary {
            background-color: #1E366F;
            border-color: #1E366F;
        }
        .btn-primary:hover {
            background-color: #152a5a;
            border-color: #152a5a;
        }
        #loader {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
        #result {
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">Recuperação de Senha</h3>
            </div>
            <div class="card-body">
                <div id="emailForm">
                    <p class="lead">Informe seu e-mail para receber um link de redefinição de senha.</p>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                    </div>
                    <button type="button" id="resetBtn" class="btn btn-primary w-100">Enviar Link de Recuperação</button>
                </div>
                
                <div id="loader">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Enviando...</span>
                    </div>
                    <p class="mt-2">Enviando link de recuperação...</p>
                </div>
                
                <div id="result" class="alert">
                    <p id="resultMessage"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.8/firebase-app-compat.js"></script>
    <!-- Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/9.6.8/firebase-auth-compat.js"></script>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBSsZXb1DbCzI_FTuX9Z_d4zY538vQJ9Us",
            authDomain: "planner-organizer-68a23.firebaseapp.com",
            projectId: "planner-organizer-68a23",
            storageBucket: "planner-organizer-68a23.appspot.com",
            messagingSenderId: "763383033284",
            appId: "1:763383033284:web:5a5dc3b4d3f5bc63631ce7",
            measurementId: "G-XQP8M2ZKHZ"
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);

        // Referência para elementos DOM
        const emailForm = document.getElementById('emailForm');
        const emailInput = document.getElementById('email');
        const resetBtn = document.getElementById('resetBtn');
        const loader = document.getElementById('loader');
        const result = document.getElementById('result');
        const resultMessage = document.getElementById('resultMessage');

        // Função para enviar o e-mail de recuperação
        resetBtn.addEventListener('click', function() {
            const email = emailInput.value.trim();
            
            if (!email) {
                showResult('Por favor, informe seu e-mail.', 'alert-warning');
                return;
            }
            
            // Mostrar loader
            emailForm.style.display = 'none';
            loader.style.display = 'block';
            
            // Enviar e-mail de recuperação
            firebase.auth().sendPasswordResetEmail(email)
                .then(() => {
                    // Sucesso
                    showResult('E-mail de recuperação enviado com sucesso! Verifique sua caixa de entrada e pasta de spam.', 'alert-success');
                })
                .catch((error) => {
                    // Erro
                    console.error('Erro:', error);
                    
                    let errorMessage = 'Ocorreu um erro ao enviar o e-mail de recuperação.';
                    
                    if (error.code === 'auth/user-not-found') {
                        errorMessage = 'Não encontramos uma conta com este e-mail.';
                    } else if (error.code === 'auth/invalid-email') {
                        errorMessage = 'O formato do e-mail é inválido.';
                    }
                    
                    showResult(errorMessage, 'alert-danger');
                    
                    // Mostrar formulário novamente
                    emailForm.style.display = 'block';
                });
        });

        // Função para mostrar resultado
        function showResult(message, alertClass) {
            loader.style.display = 'none';
            result.style.display = 'block';
            result.className = 'alert ' + alertClass;
            resultMessage.textContent = message;
        }
    </script>
</body>
</html>
