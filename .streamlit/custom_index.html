<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planner Organizer - Sistema Profissional</title>
    
    <!-- Polyfills e compatibilidade -->
    <script>
        // Fix para problemas de importação de módulos
        window.global = window;
        window.process = { env: {} };
        
        // Patch para suporte a ES modules
        if (typeof document !== 'undefined') {
            const originalCreateElement = document.createElement;
            document.createElement = function(tag) {
                const element = originalCreateElement.call(document, tag);
                if (tag.toLowerCase() === 'script') {
                    // Intercepta a criação de elementos script
                    const originalSetAttribute = element.setAttribute;
                    element.setAttribute = function(name, value) {
                        if (name === 'type' && value === 'module') {
                            console.log('Convertendo script type="module" para script normal');
                            // Não define o atributo type="module"
                            return element;
                        }
                        return originalSetAttribute.call(this, name, value);
                    };
                }
                return element;
            };
        }
        
        // Função para carregar scripts manualmente se necessário
        function loadScript(src, async = false, defer = false) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.async = async;
                script.defer = defer;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }
        
        // Verificar se o script principal falhar ao carregar
        window.addEventListener('error', function(event) {
            if (event.target && event.target.tagName === 'SCRIPT' && event.target.src.includes('index.')) {
                console.warn('Módulo principal falhou, tentando carregar de forma alternativa...');
                const scriptUrl = event.target.src;
                
                // Remover script original
                event.target.remove();
                
                // Tentar carregar o script novamente sem type="module"
                const newScript = document.createElement('script');
                newScript.src = scriptUrl;
                newScript.async = true;
                newScript.onerror = function() {
                    console.error('Falha também na segunda tentativa de carregamento');
                };
                document.head.appendChild(newScript);
            }
        }, true);
    </script>
    
    <!-- Script de correção externo -->
    <script src="fix_render_imports.js"></script>
    
    <!-- Meta tags e favicons serão adicionados pelo Streamlit -->
</head>
<body>
    <noscript>Você precisa ativar o JavaScript para executar este aplicativo.</noscript>
    <div id="root"></div>
    <!-- Scripts do Streamlit serão injetados aqui -->
</body>
</html>
