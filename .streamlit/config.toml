[server]
headless = true
address = "0.0.0.0"
port = 5000
runOnSave = false
fileWatcherType = "none"
maxUploadSize = 200
enableStaticServing = true

[client]
showSidebarNavigation = false
showErrorDetails = false
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#C9A84C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#0D1B2A"
textColor = "#262730"
font = "sans serif"