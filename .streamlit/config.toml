[server]
headless = true
address = "0.0.0.0"
port = 5000

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#F1A208"  # Cor amarela para botões principais
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[ui]
# Mais opções visuais
hideTopBar = false

[runner]
# Configurações de execução
magicEnabled = true
fastReruns = true

[logger]
level = "info"