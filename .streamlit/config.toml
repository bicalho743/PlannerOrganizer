[server]
headless = true
address = "0.0.0.0"
port = 5000
enableCORS = true
enableWebsocketCompression = true
enableXsrfProtection = false
maxUploadSize = 50
fileWatcherType = "none"

[theme]
primaryColor = "#1E88E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[browser]
gatherUsageStats = false
serverAddress = ""
serverPort = 0
