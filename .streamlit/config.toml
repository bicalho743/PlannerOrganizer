[server]
headless = true
address = "0.0.0.0"
port = 5000
enableCORS = false
enableXsrfProtection = false

[theme]
primaryColor = "#F1A208"
backgroundColor = "#1C1C1C"
secondaryBackgroundColor = "#2E2E2E"
textColor = "#F5F5F5"
font = "sans serif"
base = "dark"

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"

[runner]
fastReruns = true

[ui]
hideTopBar = true