[server]
headless = true
address = "0.0.0.0"
port = 5000
runOnSave = false
fileWatcherType = "none"
maxUploadSize = 200
enableStaticServing = true

[client]
showSidebarNavigation = false
showErrorDetails = false
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#0D1B2A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F4F7"
textColor = "#101828"
font = "sans serif"