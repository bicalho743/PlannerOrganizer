<!-- Firebase Authentication Component (MODO DE DESENVOLVIMENTO) -->
<script>
    // Função de login simulada para ambiente de desenvolvimento
    function simulateGoogleSignIn() {
        console.log('Simulando login com Google (ambiente de desenvolvimento)');
        
        try {
            // Verificar se estamos em HTTP (ambiente de desenvolvimento)
            const isDevEnvironment = window.location.protocol === 'http:';
            
            // Mostrar mensagem informativa
            document.getElementById('firebase-error').textContent = 
                'Autenticação do Google requer HTTPS. Usando login simulado para desenvolvimento.';
            document.getElementById('firebase-error').style.display = 'block';
            
            // Simular um login para ambiente de desenvolvimento
            const simulatedEmail = 'usuario.teste@gmail.com';
            const simulatedName = 'Usuário Teste';
            const simulatedPhotoURL = 'https://lh3.googleusercontent.com/a/default-user=s96-c';
            
            // Criar um payload de "token" simulado (apenas para desenvolvimento)
            const mockAuthPayload = {
                provider: 'google',
                email: simulatedEmail,
                name: simulatedName,
                photoURL: simulatedPhotoURL,
                isSimulated: true,
                timestamp: Date.now()
            };
            
            // Codificar o payload para simular um token (usando apenas caracteres ASCII seguros)
            const mockToken = encodeURIComponent(JSON.stringify(mockAuthPayload));
            
            // Redirecionar com o token simulado
            const redirectUrl = window.location.origin + 
                '?auth_provider=google_dev&id_token=' + encodeURIComponent(mockToken);
            
            // Mostrar informação e redirecionar após um pequeno delay
            document.getElementById('auth-info').innerHTML = 
                '<p>Redirecionando com usuário simulado: ' + simulatedEmail + '</p>';
            document.getElementById('auth-info').style.display = 'block';
            
            setTimeout(() => {
                window.location.href = redirectUrl;
            }, 1500);
            
        } catch (e) {
            console.error('Erro ao simular login com Google:', e);
            document.getElementById('firebase-error').textContent = 
                'Erro ao simular login: ' + e.message;
            document.getElementById('firebase-error').style.display = 'block';
        }
    }

    // Adicionar função global para acionamento direto
    window.googleLogin = simulateGoogleSignIn;
    
    // Adicionar listeners para botões de login quando o DOM estiver pronto
    window.addEventListener('DOMContentLoaded', function() {
        console.log('DOM carregado (modo desenvolvimento), configurando botões');
        
        // Encontrar todos os botões de login com Google
        const buttons = document.querySelectorAll('.google-login-button');
        console.log('Botões encontrados:', buttons.length);
        
        buttons.forEach(button => {
            button.addEventListener('click', function(e) {
                console.log('Botão de login Google clicado');
                e.preventDefault();
                simulateGoogleSignIn();
            });
        });
    });
    
    // Verificar se o script realmente executou
    console.log('Script de autenticação Google (modo desenvolvimento) carregado e executado');
</script>

<!-- Elemento para armazenar configuração do Firebase (mantido para compatibilidade) -->
<div id="firebase-config" style="display: none;"></div>

<!-- Elemento para mostrar erros -->
<div id="firebase-error" style="display: none; color: red; margin: 10px 0; padding: 10px; background: #ffeeee; border-radius: 4px;"></div>

<!-- Elemento para mostrar informações -->
<div id="auth-info" style="display: none; color: green; margin: 10px 0; padding: 10px; background: #eeffee; border-radius: 4px;"></div>

<!-- Botão de login alternativo para ambiente de desenvolvimento -->
<button 
    onclick="window.googleLogin()"
    style="
        background-color: #4285F4;
        color: white;
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        margin: 5px 0;
    "
>
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" 
         style="width: 18px; height: 18px; margin-right: 8px; background: white; padding: 2px; border-radius: 2px;">
    Login Google (ambiente de desenvolvimento)
</button>

<div style="margin: 10px 0; font-size: 0.8rem; color: #666;">
    <p>⚠️ Autenticação completa do Google requer HTTPS. Usando login simulado no ambiente de desenvolvimento.</p>
</div>
