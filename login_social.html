<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Social - Planner Organizer</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f9fafc, #eef5ff);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      padding: 30px;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    h1 {
      color: #2d8cff;
      margin-bottom: 30px;
    }
    .logo {
      width: 120px;
      margin-bottom: 20px;
    }
    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
    }
    .facebook-button {
      background-color: #3b5998;
      color: white;
    }
    .facebook-button:hover {
      background-color: #344e86;
      transform: translateY(-2px);
    }
    .google-button {
      background-color: white;
      color: #5A6A85;
      border: 1px solid #E0E0E0;
    }
    .google-button:hover {
      background-color: #f5f5f5;
      transform: translateY(-2px);
    }
    .button-icon {
      margin-right: 10px;
      width: 24px;
      height: 24px;
    }
    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
    }
    .divider-line {
      flex-grow: 1;
      height: 1px;
      background-color: #E0E0E0;
    }
    .divider-text {
      padding: 0 15px;
      color: #5A6A85;
      font-size: 14px;
    }
    .back-link {
      color: #2d8cff;
      text-decoration: none;
      margin-top: 20px;
      display: inline-block;
      font-size: 14px;
    }
    .back-link:hover {
      text-decoration: underline;
    }
    #error-message {
      color: #ff4d4f;
      margin-top: 15px;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Planner Organizer</h1>
    <div>
      <button class="button facebook-button" onclick="loginComFacebook()">
        <svg class="button-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512">
          <path fill="currentColor" d="M279.14 288l14.22-92.66h-88.91v-60.13c0-25.35 12.42-50.06 52.24-50.06h40.42V6.26S260.43 0 225.36 0c-73.22 0-121.08 44.38-121.08 124.72v70.62H22.89V288h81.39v224h100.17V288z"/>
        </svg>
        Entrar com Facebook
      </button>
      
      <button class="button google-button" onclick="loginComGoogle()">
        <svg class="button-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 512">
          <path fill="#4285F4" d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 123 24.5 166.3 64.9l-67.5 64.9C258.5 52.6 94.3 116.6 94.3 256c0 86.5 69.1 156.6 153.7 156.6 98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 24.9 3.9 41.4z"/>
        </svg>
        Entrar com Google
      </button>
    </div>
    
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">ou</div>
      <div class="divider-line"></div>
    </div>
    
    <a href="https://plannerorganizer.bicalho743.repl.co" class="back-link">Voltar para login tradicional</a>
    
    <div id="error-message"></div>
  </div>

  <script>
    // Configuração do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyA8xzYgZXCkZ-97RWQZXtMpvLVf1Jx8wjk",
      authDomain: "planner-organizer.firebaseapp.com",
      projectId: "planner-organizer",
      storageBucket: "planner-organizer.appspot.com",
      messagingSenderId: "695046724018",
      appId: "1:695046724018:web:98d8feec0c6b6c937d57fd",
      databaseURL: "https://planner-organizer-default-rtdb.firebaseio.com"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    
    function showError(message) {
      const errorElement = document.getElementById('error-message');
      errorElement.textContent = message;
      errorElement.style.display = 'block';
    }

    function loginComFacebook() {
      const provider = new firebase.auth.FacebookAuthProvider();
      firebase.auth().signInWithPopup(provider)
        .then((result) => {
          return result.user.getIdToken();
        })
        .then((token) => {
          window.location.href = `https://plannerorganizer.bicalho743.repl.co/?token=${token}`;
        })
        .catch((error) => {
          console.error("Erro ao autenticar com Facebook:", error);
          showError(`Erro ao entrar com Facebook: ${error.message}`);
        });
    }

    function loginComGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(provider)
        .then((result) => {
          return result.user.getIdToken();
        })
        .then((token) => {
          window.location.href = `https://plannerorganizer.bicalho743.repl.co/?token=${token}`;
        })
        .catch((error) => {
          console.error("Erro ao autenticar com Google:", error);
          showError(`Erro ao entrar com Google: ${error.message}`);
        });
    }
  </script>
</body>
</html>
