<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo circular com gradiente azul -->
  <circle cx="256" cy="256" r="256" fill="url(#paint0_linear)"/>
  
  <!-- Contorno de agenda/organizer -->
  <rect x="136" y="96" width="240" height="320" rx="16" fill="#FFFFFF" stroke="#2A3F5F" stroke-width="8"/>
  
  <!-- Linhas horizontais representando uma agenda -->
  <line x1="160" y1="160" x2="352" y2="160" stroke="#2A3F5F" stroke-width="4"/>
  <line x1="160" y1="200" x2="352" y2="200" stroke="#2A3F5F" stroke-width="4"/>
  <line x1="160" y1="240" x2="352" y2="240" stroke="#2A3F5F" stroke-width="4"/>
  <line x1="160" y1="280" x2="352" y2="280" stroke="#2A3F5F" stroke-width="4"/>
  <line x1="160" y1="320" x2="352" y2="320" stroke="#2A3F5F" stroke-width="4"/>
  <line x1="160" y1="360" x2="352" y2="360" stroke="#2A3F5F" stroke-width="4"/>
  
  <!-- Marca de verificação (check) -->
  <path d="M196 184 L216 204 L248 172" stroke="#F1A208" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Ícone de checklist (marca de verificação em caixas) -->
  <rect x="176" y="224" width="24" height="24" rx="4" fill="#E2E8F0" stroke="#375170" stroke-width="2"/>
  <path d="M180 236 L188 244 L196 228" stroke="#F1A208" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <rect x="176" y="264" width="24" height="24" rx="4" fill="#E2E8F0" stroke="#375170" stroke-width="2"/>
  <path d="M180 276 L188 284 L196 268" stroke="#F1A208" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <rect x="176" y="304" width="24" height="24" rx="4" fill="#E2E8F0" stroke="#375170" stroke-width="2"/>
  <path d="M180 316 L188 324 L196 308" stroke="#F1A208" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Texto representando um título simples -->
  <rect x="220" y="224" width="100" height="8" rx="4" fill="#375170"/>
  <rect x="220" y="240" width="80" height="6" rx="3" fill="#2A3F5F" fill-opacity="0.6"/>
  
  <rect x="220" y="264" width="100" height="8" rx="4" fill="#375170"/>
  <rect x="220" y="280" width="80" height="6" rx="3" fill="#2A3F5F" fill-opacity="0.6"/>
  
  <rect x="220" y="304" width="100" height="8" rx="4" fill="#375170"/>
  <rect x="220" y="320" width="80" height="6" rx="3" fill="#2A3F5F" fill-opacity="0.6"/>
  
  <!-- Borda superior da agenda -->
  <rect x="136" y="96" width="240" height="40" rx="16" fill="#2A3F5F"/>
  <text x="206" y="124" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">PLANNER</text>
  
  <!-- Definições de gradientes e outros efeitos -->
  <defs>
    <linearGradient id="paint0_linear" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A3F5F"/>
      <stop offset="1" stop-color="#375170"/>
    </linearGradient>
  </defs>
</svg>