<!DOCTYPE html>
<html>
<head>
  <title>Checkout PlannerOrganizer</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      background: linear-gradient(135deg, #f9fafc, #eef5ff);
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }
    
    h2 {
      color: #1E366F;
      margin-bottom: 30px;
    }
    
    .plans {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }
    
    .plan {
      background-color: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      width: 250px;
      border: 1px solid #e0e0e0;
    }
    
    .plan-title {
      font-weight: bold;
      font-size: 1.2rem;
      color: #1E366F;
      margin-bottom: 10px;
    }
    
    .price {
      font-size: 1.8rem;
      font-weight: bold;
      color: #2D8CFF;
      margin-bottom: 20px;
    }
    
    button {
      background: linear-gradient(135deg, #2D8CFF, #1E366F);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    button:hover {
      background: linear-gradient(135deg, #1E66B5, #152A50);
      transform: translateY(-2px);
    }
    
    .featured {
      border: 2px solid #2D8CFF;
      position: relative;
      overflow: hidden;
    }
    
    .featured::before {
      content: "RECOMENDADO";
      position: absolute;
      top: 10px;
      right: -30px;
      background: #ff6b6b;
      color: white;
      padding: 5px 40px;
      font-size: 10px;
      font-weight: bold;
      transform: rotate(45deg);
    }
    
    .featured button {
      background: linear-gradient(135deg, #ff6b6b, #e83e3e);
    }
    
    .featured button:hover {
      background: linear-gradient(135deg, #e83e3e, #cf2b2b);
    }
  </style>
</head>
<body>
  <h2>Planos PlannerOrganizer</h2>
  
  <div class="plans">
    <div class="plan">
      <div class="plan-title">Plano Mensal</div>
      <div class="price">R$ 9,70</div>
      <button id="checkout-button-monthly">Assinar Mensal</button>
    </div>
    
    <div class="plan featured">
      <div class="plan-title">Plano Anual</div>
      <div class="price">R$ 97,00</div>
      <button id="checkout-button-yearly">Assinar Anual</button>
    </div>
    
    <div class="plan">
      <div class="plan-title">Acesso Vitalício</div>
      <div class="price">R$ 247,00</div>
      <button id="checkout-button-lifetime">Comprar Vitalício</button>
    </div>
  </div>

  <script>
    const stripe = Stripe("pk_live_51RFB2dLWUPER7pUXim2VuVkCESsrjNcHkDQuMJeDCvvW0ZsyFfqM2exfCTwSSe5O4R2TXBxHJtIpYSGBTAx2gBXT00gpAVYK1f");

    // Função para fazer o checkout com um plano específico
    async function checkout(planId) {
      try {
        const response = await fetch(`/create-checkout-session/${planId}`, {
          method: "POST"
        });
        
        const session = await response.json();
        
        if (session.error) {
          console.error("Erro:", session.error);
          alert("Erro ao processar pagamento: " + session.error);
          return;
        }
        
        const result = await stripe.redirectToCheckout({
          sessionId: session.id
        });
        
        if (result.error) {
          console.error("Erro:", result.error);
          alert("Erro ao redirecionar: " + result.error.message);
        }
      } catch (error) {
        console.error("Erro:", error);
        alert("Erro ao processar pagamento. Por favor, tente novamente.");
      }
    }

    // Configurar listeners para os botões
    document.getElementById("checkout-button-monthly").addEventListener("click", () => {
      checkout("monthly");
    });
    
    document.getElementById("checkout-button-yearly").addEventListener("click", () => {
      checkout("yearly");
    });
    
    document.getElementById("checkout-button-lifetime").addEventListener("click", () => {
      checkout("lifetime");
    });
  </script>
</body>
</html>
