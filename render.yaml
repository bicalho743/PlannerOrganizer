
services:
  - type: web
    name: planner-organiza
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --server.enableCORS=false --server.enableWebsocketCompression=false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
    autoDeploy: true
