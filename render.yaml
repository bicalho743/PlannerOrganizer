
services:
  - type: web
    name: planner-organiza
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: >
      python render_deploy_final.py &&
      streamlit run app.py
      --server.port=$PORT
      --server.address=0.0.0.0
      --server.headless=true
      --server.enableCORS=true
      --server.enableWebsocketCompression=true
      --server.enableXsrfProtection=false
      --server.maxUploadSize=50
      --client.showSidebarNavigation=true
      --client.sidebarState=expanded
      --ui.hideSidebarNav=false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false # Você precisa definir isso manualmente no dashboard do Render
      - key: JWT_SECRET
        sync: false # Você precisa definir isso manualmente no dashboard do Render
      - key: RENDER_DEPLOYMENT_ID
        generateValue: true # Gera um ID único para o deploy
      - key: RENDER_DEPLOY_TIME
        time: 300 # Espera 5 minutos (300s) para iniciar o serviço após o build
      - key: STREAMLIT_CLIENT_SHOW_SIDEBAR_NAVIGATION
        value: true
      - key: STREAMLIT_CLIENT_SIDEBAR_STATE
        value: expanded
      - key: STREAMLIT_UI_HIDE_SIDEBAR_NAV
        value: false
      - key: STREAMLIT_CLIENT_CACHING
        value: true
      - key: STREAMLIT_SIDEBAR_COLLAPSE_FIX
        value: enabled
    autoDeploy: true
    healthCheckPath: /_stcore/health
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src * 'self' 'unsafe-inline' data: blob:;"
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    plan: free # Você pode mudar para 'starter' se precisar de mais recursos

databases:
  - name: planner-db
    plan: free # Plano gratuito com 1GB de armazenamento 
    databaseName: planner
    user: planner_user
