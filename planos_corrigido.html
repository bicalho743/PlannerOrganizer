<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planos - Planner Organizer</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1, h2 {
            text-align: center;
            color: #1E366F;
        }
        
        p.desc {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
        }
        
        .cards-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin: 40px 0;
        }
        
        .plano-card {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            padding: 30px;
            width: 300px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .plano-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        
        .plano-card.destaque {
            border: 2px solid #FF5722;
        }
        
        .badge {
            position: absolute;
            top: 0;
            right: 0;
            background-color: #FF5722;
            color: white;
            padding: 8px 0;
            transform: rotate(45deg) translate(15px, -15px);
            width: 200px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        .plano-card h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        
        .preco {
            font-size: 3rem;
            font-weight: bold;
            color: #2196F3;
            text-align: center;
            margin: 15px 0 5px;
        }
        
        .periodo {
            color: #757575;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .economia {
            background-color: #E8F5E9;
            color: #2E7D32;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: 600;
            display: block;
            margin: 10px auto;
            text-align: center;
            width: 80%;
        }
        
        .recursos {
            list-style-type: none;
            margin: 25px 0;
            padding: 0;
        }
        
        .recursos li {
            margin: 15px 0;
            padding-left: 30px;
            position: relative;
        }
        
        .recursos li:before {
            content: "✓";
            color: #4CAF50;
            position: absolute;
            left: 0;
            font-weight: bold;
        }
        
        .btn-assinar {
            display: block;
            width: 100%;
            padding: 15px 0;
            background-color: #2196F3;
            color: white;
            text-align: center;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 20px;
        }
        
        .btn-assinar:hover {
            background-color: #1976D2;
        }
        
        .btn-assinar.anual {
            background-color: #FF5722;
        }
        
        .btn-assinar.anual:hover {
            background-color: #E64A19;
        }
        
        .btn-assinar.vitalicio {
            background-color: #FFC107;
            color: #333;
        }
        
        .btn-assinar.vitalicio:hover {
            background-color: #FFA000;
        }
        
        .teste-gratuito {
            text-align: center;
            margin: 60px 0;
            padding: 40px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        
        .btn-teste {
            display: inline-block;
            padding: 15px 30px;
            background-color: #1E366F;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background-color 0.3s;
            margin-top: 20px;
        }
        
        .btn-teste:hover {
            background-color: #152a5c;
        }
        
        footer {
            margin-top: 50px;
            padding: 30px 0;
            text-align: center;
            color: #757575;
        }
        
        @media (max-width: 768px) {
            .cards-wrapper {
                flex-direction: column;
                align-items: center;
            }
            
            .plano-card {
                width: 100%;
                max-width: 350px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Planner Organizer</h1>
        <p class="desc">Escolha o plano ideal para sua organização</p>
        
        <!-- Container para montar o componente React -->
        <div id="root"></div>
        
        <!-- Script com sintaxe correta para React -->
        <script type="text/babel">
            // Componente React com sintaxe correta para onClick
            const PlanosComponent = () => {
                // URLs do Stripe para os planos
                const CHECKOUT_URLS = {
                    mensal: "https://buy.stripe.com/test_28og2t34LeLJ6mQ144",
                    anual: "https://buy.stripe.com/test_7sI7vRcJ56T29z8dQQ",
                    vitalicio: "https://buy.stripe.com/test_eVa2bv34L1Aw29yfYZ"
                };
                
                // Função simples para redirecionar
                const handleCheckout = (url) => {
                    window.location.href = url;
                };
                
                return (
                    <div>
                        <div className="cards-wrapper">
                            {/* Plano Mensal */}
                            <div className="plano-card">
                                <h2>Plano Mensal</h2>
                                <div className="preco">R$9,70</div>
                                <div className="periodo">por mês</div>
                                
                                <ul className="recursos">
                                    <li>Acesso a todos os recursos</li>
                                    <li>Suporte por e-mail</li>
                                    <li>Cancelamento a qualquer momento</li>
                                </ul>
                                
                                {/* CORRETO: usando arrow function no onClick */}
                                <button 
                                    className="btn-assinar"
                                    onClick={() => handleCheckout(CHECKOUT_URLS.mensal)}
                                >
                                    ASSINAR MENSAL
                                </button>
                            </div>
                            
                            {/* Plano Anual */}
                            <div className="plano-card destaque">
                                <div className="badge">RECOMENDADO</div>
                                <h2>Plano Anual</h2>
                                <div className="preco">R$97,00</div>
                                <div className="periodo">por ano</div>
                                <div className="economia">ECONOMIZE 17%</div>
                                
                                <ul className="recursos">
                                    <li>Acesso a todos os recursos</li>
                                    <li>Suporte prioritário</li>
                                    <li>Atualizações gratuitas</li>
                                    <li>Treinamento personalizado</li>
                                </ul>
                                
                                {/* CORRETO: usando arrow function no onClick */}
                                <button 
                                    className="btn-assinar anual"
                                    onClick={() => handleCheckout(CHECKOUT_URLS.anual)}
                                >
                                    ASSINAR ANUAL
                                </button>
                            </div>
                            
                            {/* Plano Vitalício */}
                            <div className="plano-card">
                                <h2>Acesso Vitalício</h2>
                                <div className="preco">R$247,00</div>
                                <div className="periodo">pagamento único</div>
                                
                                <ul className="recursos">
                                    <li>Acesso permanente ao sistema</li>
                                    <li>Suporte prioritário</li>
                                    <li>Sem mensalidades futuras</li>
                                    <li>Acesso a todas as atualizações</li>
                                </ul>
                                
                                {/* CORRETO: usando arrow function no onClick */}
                                <button 
                                    className="btn-assinar vitalicio"
                                    onClick={() => handleCheckout(CHECKOUT_URLS.vitalicio)}
                                >
                                    COMPRAR VITALÍCIO
                                </button>
                            </div>
                        </div>
                        
                        <div className="teste-gratuito">
                            <h2>Não está pronto para assinar?</h2>
                            <p>Experimente grátis por 7 dias sem necessidade de cartão de crédito.</p>
                            
                            {/* CORRETO: usando arrow function no onClick */}
                            <button 
                                className="btn-teste"
                                onClick={() => window.location.href = '/iniciar-teste'}
                            >
                                INICIAR TESTE GRATUITO
                            </button>
                        </div>
                    </div>
                );
            };
            
            // Renderizar o componente no elemento com id "root"
            ReactDOM.render(<PlanosComponent />, document.getElementById('root'));
        </script>
        
        <footer>
            <p>Planner Organizer &copy; 2025 - Todos os direitos reservados</p>
        </footer>
    </div>
</body>
</html>
